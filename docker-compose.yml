services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-m15db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-m15db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - appnet

  # Redis cache
  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - appnet

  # Redis exporter (Redis metrics for Prometheus)
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    ports:
      - "9121:9121"
    networks:
      - appnet

  # Postgres exporter (DB metrics for Prometheus)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-m15db}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - appnet

  # Backend API сервис
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_SERVICE_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - appnet

  # Telegram Bot сервис
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./bot:/app
      - ./backend/uploads:/uploads:ro

  # Worker для отправки напоминаний
  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_SERVICE_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - bot
      - redis
    volumes:
      - ./worker:/app
    networks:
      - appnet

  # parser service removed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - appnet

  # Prometheus (metrics storage + scraping)
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=365d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - cadvisor
      - node-exporter
      - postgres-exporter
      - redis-exporter
      - blackbox-exporter
    networks:
      - appnet

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - appnet

  # Loki (централизованные логи, single-binary)
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    mem_limit: 512m
    networks:
      - appnet

  # Fluent Bit → Loki (логи контейнеров backend, bot, worker, postgres, redis)
  fluent-bit:
    image: fluent/fluent-bit:2.2.3
    restart: unless-stopped
    user: root
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fluent_bit_data:/var/log
    depends_on:
      - loki
    mem_limit: 128m
    networks:
      - appnet

  # cAdvisor (container metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # Docker Engine на сервере требует API >= 1.44; без этого Docker-фактори
    # cAdvisor не регистрируется и контейнеры остаются без label `name`.
    environment:
      - DOCKER_API_VERSION=1.44
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"
    networks:
      - appnet

  # blackbox-exporter (внешняя доступность по HTTP/TCP + срок SSL)
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "9115:9115"
    networks:
      - appnet

  # node-exporter (host metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - appnet

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
  fluent_bit_data:

networks:
  appnet:
    driver: bridge
