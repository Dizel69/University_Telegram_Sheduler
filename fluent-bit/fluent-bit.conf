[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb_docker.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       30

[FILTER]
    Name                docker
    Match               docker.*
    Docker_Mode         On
    Docker_Mode_Flush   4
    Docker_Mode_Parser  docker
    Merge_Log           On
    Keep_Log            Off
    Container_Log_Key   log

[FILTER]
    Name    grep
    Match   docker.*
    Regex   container_name (backend|bot|worker|postgres|redis)

[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/extract_job.lua
    call   extract_job

[OUTPUT]
    Name                   loki
    Match                  docker.*
    Host                   loki
    Port                   3100
    Labels                 source=containers
    Label_keys             $job,$container_name
    Remove_keys            container_id
    Auto_kubernetes_labels off
    line_format            json
