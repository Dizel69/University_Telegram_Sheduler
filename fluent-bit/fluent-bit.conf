[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb_docker.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       30

[FILTER]
    Name   modify
    Match  docker.*
    Add    job container_logs
    Add    source containers

[OUTPUT]
    Name                   loki
    Match                  docker.*
    Host                   loki
    Port                   3100
    Labels                 source=containers,job=container_logs
    Auto_kubernetes_labels off
    line_format            json
