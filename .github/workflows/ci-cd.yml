name: CI/CD simple deploy

on:
  push:
    branches: [ main ]

jobs:
  parse_commit:
    name: Parse commit name
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.parse.outputs.should_build }}
    steps:
      - name: Parse last commit title
        id: parse
        run: |
          COMMIT_TITLE="${{ github.event.head_commit.message }}"
          FIRST_LINE="$(printf '%s\n' "$COMMIT_TITLE" | sed -n '1p')"
          FIRST_LINE_LOWER="$(printf '%s' "$FIRST_LINE" | tr '[:upper:]' '[:lower:]')"

          if printf '%s' "$FIRST_LINE_LOWER" | grep -Eq '^docs($|[:(])'; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Commit starts with docs, build is skipped."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Commit does not start with docs, build will continue."
          fi

  secrets_check:
    name: Secrets / env sanity check
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Verify required deploy secrets are set
        run: |
          missing=""
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_PATH; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty GitHub secrets:$missing"
            exit 1
          fi
          echo "All required deploy secrets are present."

  compose_validate:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create CI env file
        run: touch .env

      - name: Validate compose configuration
        run: docker compose config --quiet

  python_tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        env:
          ADMIN_TOKEN: test-admin-token
          JWT_SECRET: test-jwt-secret
          BOT_TOKEN: 123456:test-token
          DATABASE_URL: sqlite://
          DEFAULT_CHAT_ID: "100500"
          BOT_SERVICE_URL: http://bot-service.test
          BACKEND_URL: http://backend.test
        run: pytest --cov=backend --cov=bot --cov=worker

  transfer:
    name: Transfer code to server
    runs-on: ubuntu-latest
    needs: [parse_commit, secrets_check, compose_validate, python_tests]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}

  deploy:
    name: Build and restart on server
    runs-on: ubuntu-latest
    needs: [parse_commit, transfer]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Run docker compose on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose down || true
            docker builder prune -af || true
            COMPOSE_PARALLEL_LIMIT=1 docker compose build --pull || exit 1
            docker compose up -d || exit 1
            docker ps || exit 1

  smoke_test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [parse_commit, deploy]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Check backend /metrics and bot /health
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            wait_for() {
              local url="$1"
              local label="$2"
              local attempt
              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                  echo "$label is up (attempt $attempt)"
                  return 0
                fi
                sleep 2
              done
              echo "::error::$label did not become ready at $url"
              return 1
            }

            wait_for "http://127.0.0.1:8000/metrics" "backend"
            curl -fsS --max-time 10 "http://127.0.0.1:8000/metrics" | head -c 200
            echo ""

            wait_for "http://127.0.0.1:8081/health" "bot-service"
            curl -fsS --max-time 10 "http://127.0.0.1:8081/health"
            echo ""
            echo "Smoke tests passed."
