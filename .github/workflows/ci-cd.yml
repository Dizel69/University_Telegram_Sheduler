name: CI/CD simple deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse_commit:
    name: Parse commit and changed paths
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.parse.outputs.should_build }}
      needs_deploy: ${{ steps.parse.outputs.needs_deploy }}
      deploy_app: ${{ steps.parse.outputs.deploy_app }}
      deploy_monitoring: ${{ steps.parse.outputs.deploy_monitoring }}
      python_tests: ${{ steps.parse.outputs.python_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse commit title and changed files
        id: parse
        run: |
          set -euo pipefail

          COMMIT_TITLE="${{ github.event.head_commit.message }}"
          FIRST_LINE="$(printf '%s\n' "$COMMIT_TITLE" | sed -n '1p')"
          FIRST_LINE_LOWER="$(printf '%s' "$FIRST_LINE" | tr '[:upper:]' '[:lower:]')"

          should_build=true
          deploy_app=false
          deploy_monitoring=false
          python_tests=false

          if printf '%s' "$FIRST_LINE_LOWER" | grep -Eq '^docs($|[:(])'; then
            should_build=false
            echo "Commit starts with docs, build is skipped."
          else
            echo "Commit does not start with docs, path filters will decide what to deploy."

            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git diff-tree --no-commit-id --name-only -r "$SHA")"
            elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
            else
              CHANGED="$(git diff-tree --no-commit-id --name-only -r "$SHA")"
            fi

            echo "Changed files:"
            printf '%s\n' "$CHANGED"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                prometheus.yml|loki-config.yml|blackbox.yml|grafana|grafana/*|fluent-bit|fluent-bit/*)
                  deploy_monitoring=true
                  ;;
                docker-compose.yml|docker-compose.yaml)
                  deploy_app=true
                  deploy_monitoring=true
                  ;;
                backend/*|bot/*|worker/*|tests/*|requirements-test.txt)
                  deploy_app=true
                  python_tests=true
                  ;;
                frontend/*|parser/*)
                  deploy_app=true
                  ;;
                .github/*|*.md|.gitignore|LICENSE)
                  ;;
                *)
                  deploy_app=true
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          if [ "$deploy_app" = true ] || [ "$deploy_monitoring" = true ]; then
            needs_deploy=true
          else
            needs_deploy=false
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "needs_deploy=$needs_deploy" >> "$GITHUB_OUTPUT"
          echo "deploy_app=$deploy_app" >> "$GITHUB_OUTPUT"
          echo "deploy_monitoring=$deploy_monitoring" >> "$GITHUB_OUTPUT"
          echo "python_tests=$python_tests" >> "$GITHUB_OUTPUT"

          echo "should_build=$should_build"
          echo "needs_deploy=$needs_deploy"
          echo "deploy_app=$deploy_app"
          echo "deploy_monitoring=$deploy_monitoring"
          echo "python_tests=$python_tests"

  secrets_check:
    name: Secrets / env sanity check
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.needs_deploy == 'true' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Verify required deploy secrets are set
        run: |
          missing=""
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_PATH; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty GitHub secrets:$missing"
            exit 1
          fi
          echo "All required deploy secrets are present."

  compose_validate:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.needs_deploy == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file
        run: touch .env

      - name: Validate compose configuration
        run: docker compose config --quiet

  python_tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.python_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        env:
          ADMIN_TOKEN: test-admin-token
          JWT_SECRET: test-jwt-secret
          BOT_TOKEN: 123456:test-token
          DATABASE_URL: sqlite://
          DEFAULT_CHAT_ID: "100500"
          BOT_SERVICE_URL: http://bot-service.test
          BACKEND_URL: http://backend.test
        run: pytest --cov=backend --cov=bot --cov=worker

  transfer:
    name: Transfer code to server
    runs-on: ubuntu-latest
    needs: [parse_commit, secrets_check, compose_validate, python_tests]
    if: >
      always()
      && needs.parse_commit.result == 'success'
      && needs.parse_commit.outputs.needs_deploy == 'true'
      && needs.secrets_check.result == 'success'
      && needs.compose_validate.result == 'success'
      && (needs.python_tests.result == 'success' || needs.python_tests.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}

  deploy_app:
    name: Build and restart app
    runs-on: ubuntu-latest
    needs: [parse_commit, transfer]
    if: >
      always()
      && needs.parse_commit.outputs.deploy_app == 'true'
      && needs.transfer.result == 'success'
    steps:
      - name: Recreate application services
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            APP_SERVICES="backend bot worker frontend"
            echo "Restarting app services only: $APP_SERVICES"
            flock -w 900 /tmp/m15-docker-compose.lock env COMPOSE_PARALLEL_LIMIT=1 docker compose up -d --no-deps --build $APP_SERVICES
            docker compose ps $APP_SERVICES

  deploy_monitoring:
    name: Restart monitoring
    runs-on: ubuntu-latest
    needs: [parse_commit, transfer]
    if: >
      always()
      && needs.parse_commit.outputs.deploy_monitoring == 'true'
      && needs.transfer.result == 'success'
    steps:
      - name: Recreate monitoring services
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            MONITORING_SERVICES="prometheus grafana loki fluent-bit cadvisor blackbox-exporter node-exporter redis-exporter postgres-exporter"
            echo "Restarting monitoring services only: $MONITORING_SERVICES"
            flock -w 900 /tmp/m15-docker-compose.lock docker compose up -d --no-deps --pull missing --force-recreate $MONITORING_SERVICES
            docker compose ps $MONITORING_SERVICES

  smoke_app:
    name: Post-deploy app smoke test
    runs-on: ubuntu-latest
    needs: [parse_commit, deploy_app]
    if: >
      always()
      && needs.parse_commit.outputs.deploy_app == 'true'
      && needs.deploy_app.result == 'success'
    steps:
      - name: Check backend /metrics and bot /health
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            wait_for() {
              local url="$1"
              local label="$2"
              local attempt
              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                  echo "$label is up (attempt $attempt)"
                  return 0
                fi
                sleep 2
              done
              echo "::error::$label did not become ready at $url"
              return 1
            }

            wait_for "http://127.0.0.1:8000/metrics" "backend"
            # Не пайпить в head: при pipefail curl получает 23 (CURLE_WRITE_ERROR),
            # когда head закрывает stdout после 200 байт.
            metrics="$(curl -fsS --max-time 10 "http://127.0.0.1:8000/metrics")"
            printf '%.200s\n' "$metrics"
            echo ""

            wait_for "http://127.0.0.1:8081/health" "bot-service"
            curl -fsS --max-time 10 "http://127.0.0.1:8081/health"
            echo ""

            wait_for_worker() {
              local attempt
              for attempt in $(seq 1 30); do
                if docker compose exec -T worker python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=3)" >/dev/null 2>&1; then
                  echo "worker is up (attempt $attempt)"
                  return 0
                fi
                sleep 2
              done
              echo "::error::worker did not become ready"
              docker compose ps worker || true
              docker compose logs --tail 80 worker || true
              return 1
            }
            wait_for_worker
            echo "App smoke tests passed."

  smoke_monitoring:
    name: Post-deploy monitoring smoke test
    runs-on: ubuntu-latest
    needs: [parse_commit, deploy_monitoring]
    if: >
      always()
      && needs.parse_commit.outputs.deploy_monitoring == 'true'
      && needs.deploy_monitoring.result == 'success'
    steps:
      - name: Check Prometheus, Grafana and Loki
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            wait_for() {
              local url="$1"
              local label="$2"
              local attempt
              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                  echo "$label is up (attempt $attempt)"
                  return 0
                fi
                sleep 2
              done
              echo "::error::$label did not become ready at $url"
              return 1
            }

            wait_for "http://127.0.0.1:9090/-/healthy" "prometheus"
            wait_for "http://127.0.0.1:3001/api/health" "grafana"
            wait_for "http://127.0.0.1:3100/ready" "loki"
            echo "Monitoring smoke tests passed."
