name: CI/CD simple deploy

on:
  push:
    branches: [ main ]

jobs:
  parse_commit:
    name: Parse commit name
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.parse.outputs.should_build }}
    steps:
      - name: Parse last commit title
        id: parse
        run: |
          COMMIT_TITLE="${{ github.event.head_commit.message }}"
          FIRST_LINE="$(printf '%s\n' "$COMMIT_TITLE" | sed -n '1p')"
          FIRST_LINE_LOWER="$(printf '%s' "$FIRST_LINE" | tr '[:upper:]' '[:lower:]')"

          if printf '%s' "$FIRST_LINE_LOWER" | grep -Eq '^docs($|[:(])'; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Commit starts with docs, build is skipped."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Commit does not start with docs, build will continue."
          fi

  python_tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    needs: parse_commit
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        env:
          ADMIN_TOKEN: test-admin-token
          JWT_SECRET: test-jwt-secret
          BOT_TOKEN: 123456:test-token
          DATABASE_URL: sqlite://
          DEFAULT_CHAT_ID: "100500"
          BOT_SERVICE_URL: http://bot-service.test
          BACKEND_URL: http://backend.test
        run: pytest --cov=backend --cov=bot --cov=worker

  docker_images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [parse_commit, python_tests]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create CI env file
        run: touch .env

      - name: Build application images
        run: docker compose build --pull backend bot worker frontend

  transfer:
    name: Transfer code to server
    runs-on: ubuntu-latest
    needs: [parse_commit, docker_images]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}

  build:
    name: Build and restart on server
    runs-on: ubuntu-latest
    needs: [parse_commit, transfer]
    if: ${{ needs.parse_commit.outputs.should_build == 'true' }}
    steps:
      - name: Run docker compose on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose down || true
            docker builder prune -af || true
            COMPOSE_PARALLEL_LIMIT=1 docker compose build --pull || exit 1
            docker compose up -d || exit 1
            docker ps || exit 1

